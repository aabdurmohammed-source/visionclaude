name: build-unsigned-ipa
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15   # macos-26 runners are scarce and jobs time out in the queue; macos-15 gets a runner fast
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ClaudeVision/ios
        run: xcodegen generate

      - name: Build (no signing)
        working-directory: ClaudeVision/ios
        run: |
          xcodebuild -project ClaudeVision.xcodeproj -scheme ClaudeVision \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ClaudeVision/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClaudeVision.app Payload/
          zip -qr ClaudeVision-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeVision-unsigned-ipa
          path: ClaudeVision/ios/ClaudeVision-unsigned.ipa
